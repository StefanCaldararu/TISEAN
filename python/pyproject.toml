[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "tisean"
version = "0.0.1"
description = "Python bindings for TISEAN nonlinear time series analysis routines"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.scikit-build]
wheel.packages = ["tisean"]
cmake.source-dir = "."
