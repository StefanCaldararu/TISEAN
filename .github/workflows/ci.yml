name: TISEAN CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran python3 python3-pip

      - name: Build TISEAN
        run: |
          ./configure
          make clean
          make -j1

      - name: Install Python deps
        run: |
          pip3 install numpy pytest

      - name: Run tests
        run: |
          pytest -q
